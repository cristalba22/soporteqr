name: Monitor de disponibilidad

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: production-uptime
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verificar web y dependencias de API
        id: uptime
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location --retry 2 --retry-all-errors --max-time 20 https://soporteqr-web.vercel.app/ >/dev/null
          response="$(curl --fail --silent --show-error --retry 2 --retry-all-errors --max-time 20 https://soporteqrapi-production.up.railway.app/api/health/ready)"
          echo "$response" | grep -q '"status":"ready"'

      - name: Abrir o actualizar alerta
        if: steps.uptime.outcome == 'failure'
        uses: actions/github-script@v8
        with:
          script: |
            const title = '[Monitor] SoporteQR no responde correctamente';
            const { data: issues } = await github.rest.issues.listForRepo({ owner: context.repo.owner, repo: context.repo.repo, state: 'open', per_page: 100 });
            const existing = issues.find(issue => issue.title === title && !issue.pull_request);
            const body = `El monitor automático falló el ${new Date().toISOString()}. Revisar Vercel, Railway, PostgreSQL y el almacenamiento. [Ver ejecución](${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId})`;
            if (existing) await github.rest.issues.createComment({ owner: context.repo.owner, repo: context.repo.repo, issue_number: existing.number, body });
            else await github.rest.issues.create({ owner: context.repo.owner, repo: context.repo.repo, title, body });

      - name: Cerrar alerta recuperada
        if: steps.uptime.outcome == 'success'
        uses: actions/github-script@v8
        with:
          script: |
            const title = '[Monitor] SoporteQR no responde correctamente';
            const { data: issues } = await github.rest.issues.listForRepo({ owner: context.repo.owner, repo: context.repo.repo, state: 'open', per_page: 100 });
            const existing = issues.find(issue => issue.title === title && !issue.pull_request);
            if (existing) {
              await github.rest.issues.createComment({ owner: context.repo.owner, repo: context.repo.repo, issue_number: existing.number, body: `Servicio recuperado el ${new Date().toISOString()}.` });
              await github.rest.issues.update({ owner: context.repo.owner, repo: context.repo.repo, issue_number: existing.number, state: 'closed', state_reason: 'completed' });
            }

      - name: Marcar ejecucion fallida
        if: steps.uptime.outcome == 'failure'
        run: exit 1
