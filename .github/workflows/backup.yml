name: Backup PostgreSQL

on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-database-backup
  cancel-in-progress: false

jobs:
  backup:
    if: github.event_name == 'workflow_dispatch' || vars.BACKUPS_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres-restore:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: restore_test
          POSTGRES_PASSWORD: restore_test_password
          POSTGRES_DB: soporteqr_restore_test
        ports:
          - 55432:5432
        options: >-
          --health-cmd "pg_isready -U restore_test -d soporteqr_restore_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: ${{ secrets.PROD_DATABASE_URL }}
      BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
      AWS_ACCESS_KEY_ID: ${{ secrets.R2_BACKUP_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_BACKUP_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: auto
      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
      R2_BACKUPS_BUCKET: ${{ vars.R2_BACKUPS_BUCKET }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Validar configuracion
        shell: bash
        run: |
          set -euo pipefail
          for variable in DATABASE_URL BACKUP_PASSPHRASE AWS_ACCESS_KEY_ID AWS_SECRET_ACCESS_KEY R2_ACCOUNT_ID R2_BACKUPS_BUCKET; do
            if [[ -z "${!variable:-}" ]]; then
              echo "Falta configurar $variable" >&2
              exit 1
            fi
          done

      - name: Instalar cliente PostgreSQL
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y curl ca-certificates
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl --fail --silent --show-error \
            --output /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc \
            https://www.postgresql.org/media/keys/ACCC4CF8.asc
          . /etc/os-release
          architecture="$(dpkg --print-architecture)"
          printf '%s\n' \
            'Types: deb' \
            'URIs: https://apt.postgresql.org/pub/repos/apt' \
            "Suites: ${VERSION_CODENAME}-pgdg" \
            "Architectures: ${architecture}" \
            'Components: main' \
            'Signed-By: /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc' \
            | sudo tee /etc/apt/sources.list.d/pgdg.sources >/dev/null
          sudo apt-get update
          sudo apt-get install -y postgresql-client-18
          echo '/usr/lib/postgresql/18/bin' >> "$GITHUB_PATH"
          /usr/lib/postgresql/18/bin/pg_dump --version

      - name: Crear y cifrar backup
        id: backup
        run: bash scripts/backup-database.sh

      - name: Probar restauracion en PostgreSQL aislado
        env:
          BACKUP_PATH: ${{ steps.backup.outputs.backup_path }}
          RESTORE_DATABASE_URL: postgresql://restore_test:restore_test_password@localhost:55432/soporteqr_restore_test
        run: |
          set -euo pipefail
          bash scripts/verify-backup.sh "$BACKUP_PATH"
          bash scripts/restore-database.sh "$BACKUP_PATH"
          psql "$RESTORE_DATABASE_URL" -v ON_ERROR_STOP=1 -c 'SELECT COUNT(*) AS organizations FROM organizations;' >/dev/null

      - name: Subir backup privado a R2
        env:
          BACKUP_PATH: ${{ steps.backup.outputs.backup_path }}
          BACKUP_NAME: ${{ steps.backup.outputs.backup_name }}
        run: |
          set -euo pipefail
          endpoint="https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com"
          object="postgres/daily/${BACKUP_NAME}"
          aws s3 cp "$BACKUP_PATH" "s3://${R2_BACKUPS_BUCKET}/${object}" --endpoint-url "$endpoint" --only-show-errors
          aws s3api head-object --bucket "$R2_BACKUPS_BUCKET" --key "$object" --endpoint-url "$endpoint" >/dev/null
          echo "Backup cifrado subido y verificado: $object"
