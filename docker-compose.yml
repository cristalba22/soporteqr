services:
  postgres:
    image: postgres:16-alpine
    container_name: soporteqr_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: soporteqr
      POSTGRES_PASSWORD: soporteqr_dev_password
      POSTGRES_DB: soporteqr
    ports:
      - "5432:5432"
    volumes:
      - soporteqr_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U soporteqr -d soporteqr"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  soporteqr_pgdata:
